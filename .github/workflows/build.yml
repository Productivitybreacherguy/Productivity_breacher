name: Build Windows EXE
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyinstaller pygame psutil numpy
      - run: pyinstaller --noconfirm --windowed --name "Productivity Breacher" --add-data "music;music" "Productivity Breacher.py"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/
