name: build2

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-parent-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pygame psutil numpy

    - name: Build PARENT EXE
      run: |
        pyinstaller --noconfirm --windowed --name "Productivity Breacher PARENT" "Productivity Breacher PARENT.py"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-parent-build
        path: dist/
