name: Update Countdown

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update COUNTDOWN.md
        run: |
          python3 - <<'EOF'
          from datetime import datetime, timezone
          
          release = datetime(2026, 10, 4, 16, 0, 0, tzinfo=timezone.utc)
          now = datetime.now(timezone.utc)
          delta = release - now
          
          if delta.total_seconds() <= 0:
              text = "# ⏳ Countdown to v2.1\n\n**RELEASED!** 🎉"
          else:
              hours = int(delta.total_seconds() // 3600)
              minutes = int((delta.total_seconds() % 3600) // 60)
              text = f"""# ⏳ Countdown to v2.1

          **Release:** Sunday, October 4, 9:00 AM California (= 21:00 Tyumen)

          **Time left:** {hours} hours {minutes} minutes
          """
          
          with open("COUNTDOWN.md", "w") as f:
              f.write(text)
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add COUNTDOWN.md
          git diff --quiet && git diff --staged --quiet || git commit -m "Update countdown"
          git push
